<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麦门幻境 · 餐品图鉴</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e1014; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --text:#e8eaf0; --muted:#8b93a7;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 80px}

header{padding:44px 0 26px;text-align:center}
h1{font-size:30px;font-weight:700;letter-spacing:2px}
h1 span{background:linear-gradient(90deg,#e8b64c,#f4d78a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px;margin-top:8px}
.sub code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px;color:#b8c0d4}

.meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12px;color:var(--muted)}
.chip b{color:var(--text);font-weight:600}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:26px 0 22px}
.f{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;
  padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
.f:hover{border-color:#3d4454;color:var(--text)}
.f.on{background:#2a2f3a;border-color:#4a5163;color:#fff}
.f .n{opacity:.55;font-size:11px;margin-left:4px}

.gacha{background:linear-gradient(135deg,#1a1d26,#232735);border:1px solid var(--line);
  border-radius:14px;padding:22px;margin-bottom:30px;text-align:center}
.gacha h2{font-size:16px;font-weight:600;margin-bottom:4px}
.gacha p{font-size:12px;color:var(--muted);margin-bottom:16px}
.btn{background:linear-gradient(135deg,#e8b64c,#d19a2e);color:#1a1200;border:0;border-radius:9px;
  padding:11px 26px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:500}
.pull-out{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;min-height:4px}
.pull-out .mini{width:64px;text-align:center;animation:pop .35s backwards}
.pull-out .mini svg,.pull-out .mini img{width:64px;height:64px;border-radius:8px;background:#0a0c10;object-fit:contain}
.pull-out .mini .rn{font-size:10px;margin-top:3px;font-weight:700}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;
  cursor:pointer;transition:transform .16s,border-color .16s;position:relative}
.card:hover{transform:translateY(-4px);border-color:#4a5163}
.card .art{position:relative;height:196px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .art .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card .art svg.hero{width:100%;height:100%;display:block}
.card .art img.hero-img{width:100%;height:100%;object-fit:contain;display:block}
.card .art::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(23,26,33,.92) 0%,rgba(23,26,33,.35) 9%,transparent 20%);z-index:1;pointer-events:none}
.rb{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;letter-spacing:.6px;
  padding:2px 7px;border-radius:5px;z-index:3}
.eb{position:absolute;top:8px;right:8px;width:23px;height:23px;border-radius:50%;z-index:3;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.5)}
.stars{position:absolute;bottom:8px;left:10px;font-size:9px;letter-spacing:1.5px;z-index:3;opacity:.95}
.card .body{padding:11px 12px 13px;position:relative;z-index:2}
.nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{font-size:11px;color:var(--muted);margin-top:2px}
.pw{display:flex;align-items:baseline;gap:5px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.pw .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.pw .l{font-size:10px;color:var(--muted)}

.card.SSR{border-color:rgba(232,182,76,.45);box-shadow:0 0 0 1px rgba(232,182,76,.16),0 6px 24px -12px rgba(232,182,76,.55)}
.card.SR{border-color:rgba(157,122,224,.38)}
.card.R{border-color:rgba(74,143,224,.3)}
.rb.SSR{background:linear-gradient(135deg,#e8b64c,#f6d894);color:#241a00}
.rb.SR{background:linear-gradient(135deg,#9d7ae0,#c0a5f0);color:#150a2a}
.rb.R{background:linear-gradient(135deg,#4a8fe0,#7db3f0);color:#04121f}
.rb.N{background:#3a404d;color:#b9c0cf}

.mask{position:fixed;inset:0;background:rgba(6,7,10,.84);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.mask.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:780px;width:100%;
  max-height:92vh;overflow:auto;display:grid;grid-template-columns:280px 1fr;position:relative}
.modal .left{padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;border-right:1px solid var(--line)}
.modal .left svg.hero{width:100%;height:auto;border-radius:12px}
.modal .left img.hero-img{width:100%;height:auto;display:block}
.modal .left .real{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.modal .left .real img{width:44px;height:44px;object-fit:contain;background:#0a0c10;border-radius:8px;padding:3px}
.modal .right{padding:24px 26px 26px}
.modal h3{font-size:20px;font-weight:700;padding-right:30px}
.modal .mt{font-size:12px;color:var(--muted);margin-top:4px}
.bars{margin:16px 0 14px}
.bar{display:grid;grid-template-columns:44px 1fr 38px;align-items:center;gap:9px;margin-bottom:7px;font-size:12px}
.bar .k{color:var(--muted)}
.bar .track{height:6px;background:#262b36;border-radius:3px;overflow:hidden}
.bar .fill{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--sc,#4a8fe0),color-mix(in srgb,var(--sc,#4a8fe0) 45%,#fff))}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.quote{background:var(--panel2);border-left:2px solid var(--accent,#4a8fe0);border-radius:0 8px 8px 0;
  padding:10px 13px;font-size:12.5px;color:#c3cadb;margin:14px 0}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;font-size:12px;margin-top:12px}
.kv div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:5px}
.kv .k{color:var(--muted)}
.kv .v{font-variant-numeric:tabular-nums}
.close{position:absolute;top:14px;right:16px;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;z-index:5}
footer{text-align:center;color:#5c6376;font-size:11.5px;margin-top:40px;line-height:1.9}
@media(max-width:640px){
  .modal{grid-template-columns:1fr}
  .modal .left{border-right:0;border-bottom:1px solid var(--line);padding:18px}
  h1{font-size:22px}
}
</style>
</head>

</div>

      <rect x="2" y="-20" width="3" height="14" rx="1.5" fill="#F2F5FA" transform="rotate(12 3 -13)"/></g>`;
  const sweet = `<g><path d="M-9 10 L-4 -10 L0 -6 L4 -10 L9 10 Z" fill="#F0A0BE"/>
      <circle cx="0" cy="-13" r="6" fill="#FFF1F6"/><circle cx="0" cy="-13" r="2.5" fill="#E85C86"/></g>`;
  const chicken = `<g><ellipse cx="0" cy="2" rx="11" ry="9" fill="#C77A2E"/>
      <rect x="-2.5" y="-12" width="5" height="10" rx="2.5" fill="#F5E6C8"/></g>`;
  const crown = `<g><path d="M-14 7 L-14 -9 L-6.5 -2.5 L0 -12 L6.5 -2.5 L14 -9 L14 7 Z" fill="#F2C044" stroke="#FFF3C4" stroke-width="1.2"/>
      <circle cx="0" cy="-12" r="2.2" fill="#FFF8DC"/>
      <circle cx="-6.5" cy="-3" r="1.5" fill="#FFF8DC"/><circle cx="6.5" cy="-3" r="1.5" fill="#FFF8DC"/></g>`;

  if (/套餐|三件套|四件套|双人|分享|拼|随心|八件|组合|1\+1/.test(n)) return crown;
  if (/薯/.test(n)) return fries;
  if (/可乐|雪碧|茶|咖啡|奶|汁|纯悦|饮|怡泉|麦炫|水/.test(n)) return drink;
  if (/冰淇淋|新地|麦旋风|派|拉明顿|阿芙|圆筒|雪冰/.test(n)) return sweet;
  if (/翅|鸡块|鸡排|鸡球|脆汁鸡|鸡腿/.test(n)) return chicken;
  return bun;
}

function weapon(job, c){
  if(job==="战士") return `<g transform="translate(145,104) rotate(14)">
    <rect x="-3" y="-6" width="6" height="60" rx="2" fill="#DCE3EF"/>

    <circle cx="0" cy="-7" r="8.5" fill="${c.glow}" opacity=".92"/></g>`;

/* 让每张卡长得不一样：用编号哈希决定发型 / 表情 / 发色深浅 / 配饰 */
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
function shade(hex, amt){
  const n=parseInt(hex.slice(1),16);
  const cl=v=>Math.max(0,Math.min(255,v));
  const r=cl((n>>16&255)+amt), g=cl((n>>8&255)+amt), b=cl((n&255)+amt);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function hairBack(style, c){
  if(style===1) return `<ellipse cx="50" cy="114" rx="14" ry="26" fill="${c.hair}"/><ellipse cx="150" cy="114" rx="14" ry="26" fill="${c.hair}"/>`;
  if(style===3) return `<path d="M56 82c-2 40 2 64 8 82 7-22 9-50 9-74z" fill="${c.hair}"/><path d="M144 82c2 40-2 64-8 82-7-22-9-50-9-74z" fill="${c.hair}"/>`;
  return "";
}
function bangs(style, c){
  if(style===2) return `<path d="M53 80c0-23 21-40 47-40s47 17 47 40c-5-16-19-23-32-23-9 0-13 4-15 11-2-7-6-11-15-11-13 0-27 7-32 23z" fill="${c.hair}"/>`;
  if(style===3) return `<path d="M100 40c-24 0-43 17-47 40 10-15 24-21 40-17-4 6-6 12-6 18 6-12 16-18 27-18 12 0 22 6 28 18 0-6-2-12-6-18 16-4 30 2 40 17-4-23-23-40-47-40z" fill="${c.hair}"/>`;
  return `<path d="M100 37c-26 0-45 19-47 43 7-13 17-21 28-22-3 6-4 11-4 16 5-11 14-16 23-16s18 5 23 16c0-5-1-10-4-16 11 1 21 9 28 22-2-24-21-43-47-43z" fill="${c.hair}"/>`;
}
function eyes(expr, c){
  if(expr===2) return `<path d="M74 91q9-6 18 0" stroke="#1b2230" stroke-width="4.2" fill="none" stroke-linecap="round"/>
    <path d="M108 91q9-6 18 0" stroke="#1b2230" stroke-width="4.2" fill="none" stroke-linecap="round"/>`;
  const ry = expr===3 ? 13.5 : 12;
  return `<ellipse cx="83" cy="90" rx="8.8" ry="${ry}" fill="#1b2230"/>
    <ellipse cx="117" cy="90" rx="8.8" ry="${ry}" fill="#1b2230"/>
    <circle cx="85.6" cy="85" r="3.8" fill="#fff"/>
    <circle cx="119.6" cy="85" r="3.8" fill="#fff"/>
    <circle cx="79.5" cy="95" r="2.3" fill="${c.glow}"/>
    <circle cx="113.5" cy="95" r="2.3" fill="${c.glow}"/>`;
}
function mouth(expr){
  if(expr===1) return `<ellipse cx="100" cy="109" rx="5.5" ry="6.5" fill="#8A4A3A"/><ellipse cx="100" cy="112" rx="3" ry="3.2" fill="#E07A6A"/>`;
  if(expr===2) return `<path d="M95 109 L105 109" stroke="#8A4A3A" stroke-width="2.2" stroke-linecap="round"/>`;
  if(expr===3) return `<ellipse cx="100" cy="109" rx="3.6" ry="4.6" fill="#8A4A3A"/>`;
  return `<path d="M96 108c2.5 3 6 3 8 0" stroke="#8A4A3A" stroke-width="2" fill="none" stroke-linecap="round"/>`;
}

function heroSVG(card){
  const base = PALETTE[card.element] || PALETTE["雷"];
  const h = hash(String(card.code));
  const style = h % 4;
  const expr = (h >> 2) % 4;
  const tint = ((h >> 5) % 5 - 2) * 11;
  const acc = (h >> 8) % 3;
  const c = {
    hair: shade(base.hair, tint),
    hair2: shade(base.hair2, tint),
    trim: base.trim, skin: base.skin, glow: base.glow
  };
  const ghost = card.job === "灵体";
  const id = "g" + String(card.code).replace(/[^0-9a-zA-Z]/g,"");
  const headband = acc===1
    ? `<path d="M54 64q46-20 92 0" stroke="${c.trim}" stroke-width="7" fill="none" stroke-linecap="round" opacity=".95"/>` : "";
  const earring = acc===2
    ? `<circle cx="53" cy="104" r="3.4" fill="${c.trim}"/><circle cx="147" cy="104" r="3.4" fill="${c.trim}"/>` : "";
  return `<svg class="hero" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg${id}" cx="50%" cy="32%" r="74%">
      <stop offset="0%" stop-color="${c.glow}" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#0f1217" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cl${id}"><rect width="200" height="200"/></clipPath>
  </defs>
  <g clip-path="url(#cl${id})" opacity="${ghost?.62:1}">
    <rect width="200" height="200" fill="url(#bg${id})"/>
    <circle cx="100" cy="84" r="68" fill="none" stroke="${c.glow}" stroke-width="1.2" stroke-dasharray="3 7" opacity=".5"/>
    ${weapon(card.job, c)}
    <path d="M62 200c0-36 17-52 38-52s38 16 38 52z" fill="${UNIFORM}"/>
    <path d="M100 148c14 0 24 20 26 52H74c2-32 12-52 26-52z" fill="${UNIFORM2}"/>
    <path d="M88 150 L100 168 L112 150 L104 148 L100 156 L96 148 Z" fill="${c.trim}"/>
    <path d="M100 168 L100 200" stroke="${c.trim}" stroke-width="3" opacity=".8"/>
    <rect x="56" y="152" width="13" height="38" rx="6.5" fill="${UNIFORM}"/>
    <rect x="131" y="152" width="13" height="38" rx="6.5" fill="${UNIFORM}"/>
    <circle cx="62" cy="192" r="7.5" fill="${c.skin}"/>
    <circle cx="138" cy="192" r="7.5" fill="${c.skin}"/>
    <rect x="91" y="130" width="18" height="18" rx="7" fill="${c.skin}"/>
    ${hairBack(style, c)}
    <circle cx="100" cy="84" r="47" fill="${c.skin}"/>
    <path d="M100 37c-26 0-45 19-47 43 9-11 20-17 33-17 14 0 25 6 34 17 13 0 24 6 33 17-2-24-27-60-53-60z" fill="${c.hair2}" opacity=".5"/>
    ${bangs(style, c)}
    <path d="M96 38c-1-13 4-20 11-25-2 10 0 16 5 21-5 0-11 1-16 4z" fill="${c.hair}"/>
    ${headband}
    ${eyes(expr, c)}
    <ellipse cx="67" cy="104" rx="7" ry="4.2" fill="#F0997B" opacity=".5"/>
    <ellipse cx="133" cy="104" rx="7" ry="4.2" fill="#F0997B" opacity=".5"/>
    ${mouth(expr)}
    ${earring}
    <g transform="translate(132,46) rotate(16)">${foodAccent(card.name, c)}</g>
  </g></svg>`;
}

/* 有 AI 立绘就用立绘，没有就回退到程序化 SVG，保证任何一张卡都不会开天窗 */
function heroArt(card){
  if(card.art) return `<img class="hero-img" src="${card.art}" alt="${card.name}" loading="lazy">`;
  return heroSVG(card);
}

/* ===== 页面逻辑 ===== */
document.getElementById("m-count").textContent = DATA.count;
document.getElementById("m-ssr").textContent = DATA.byRarity.SSR;
document.getElementById("m-sr").textContent = DATA.byRarity.SR;
document.getElementById("m-store").textContent = DATA.store.storeName.replace("麦当劳","");
document.getElementById("m-total").textContent = DATA.menuTotal;
document.getElementById("m-pending").textContent = DATA.menuTotal - DATA.count;

const groups = [
  {k:"all", label:"全部", test:()=>true},
  {k:"SSR", label:"SSR", test:c=>c.rarity==="SSR"},
  {k:"SR", label:"SR", test:c=>c.rarity==="SR"},
  {k:"R", label:"R", test:c=>c.rarity==="R"},
  {k:"N", label:"N", test:c=>c.rarity==="N"},
];
const elems = ["炎","风","水","草","冰","暗","光","雷"];
const elemTest = e => c => c.element===e;

let active = "all";
const filters = document.getElementById("filters");
function buildFilters(){
  const all = groups.map(g=>({...g,n:cards.filter(g.test).length}))
    .concat(elems.map(e=>({k:"e:"+e,label:e,test:elemTest(e),n:cards.filter(elemTest(e)).length})));
  filters.innerHTML = all.map(f=>
    `<button class="f${active===f.k?" on":""}" data-k="${f.k}">${f.label}<span class="n">${f.n}</span></button>`
  ).join("");
  filters.querySelectorAll(".f").forEach(b=>b.onclick=()=>{active=b.dataset.k;render();buildFilters();});
}

function statBars(c){
  const names = {ATK:"攻击",DEF:"防御",HP:"生命",SPD:"速度",CRT:"暴击",HEAL:"治疗"};
  return `<div class="bars" style="--sc:${c.elementColor}">` + Object.entries(c.stats).map(([k,v])=>{
    const pct = Math.max(2, Math.min(100, v/999*100));
    return `<div class="bar"><span class="k">${names[k]}</span>
      <span class="track"><span class="fill" style="width:${pct}%"></span></span>
      <span class="v">${v}</span></div>`;
  }).join("") + `</div>`;
}

function render(){
  const test = active==="all"?()=>true : active.startsWith("e:")?elemTest(active.slice(2))
    : (groups.find(g=>g.k===active)||groups[0]).test;
  const list = cards.filter(test);
  document.getElementById("grid").innerHTML = list.map((c,i)=>`
    <div class="card ${c.rarity}" data-i="${cards.indexOf(c)}" style="animation:pop .3s backwards;animation-delay:${Math.min(i*8,240)}ms">
      <div class="art">
        <span class="rb ${c.rarity}">${c.rarity}</span>
        <span class="eb" style="background:${c.elementColor}">${c.element}</span>
        <div class="stage">${heroArt(c)}</div>
        <span class="stars" style="color:${RARITY_COLOR[c.rarity]}">${"★".repeat(STAR[c.rarity])}</span>
      </div>
      <div class="body">
        <div class="nm">${c.name}</div>
        <div class="tl">${c.title} · ${c.job}</div>
        <div class="pw"><span class="v" style="color:${RARITY_COLOR[c.rarity]}">${c.power}</span><span class="l">战力</span></div>
      </div>
    </div>`).join("");
  document.querySelectorAll(".card").forEach(el=>el.onclick=()=>openCard(cards[+el.dataset.i]));
}

function openCard(c){
  const n = c.nutrition;
  document.getElementById("modal").innerHTML = `
    <button class="close" onclick="closeCard()">&times;</button>
    <div class="left" style="background:radial-gradient(circle at 50% 34%,${rgba(c.elementColor,.3)},${rgba(c.elementColor,.06)} 54%,#0f1217 84%)">
      ${heroArt(c)}
      <div class="real"><img src="${c.image}" alt=""><span>实物参考</span></div>
    </div>
    <div class="right">
      <h3>${c.name}</h3>
      <div class="mt">
        <span class="rb ${c.rarity}" style="position:static;display:inline-block;vertical-align:middle">${c.rarity}</span>
        <span style="color:${c.elementColor};font-weight:600;margin-left:6px">${c.element}属性</span>
        <span style="margin-left:8px">${c.title} · ${c.job} · No.${String(c.rank).padStart(3,"0")}</span>
      </div>
      ${statBars(c)}
      <div class="quote" style="--accent:${c.elementColor}">
        「${c.skill}」<br><span style="color:#8b93a7">${c.flavor}</span>
      </div>
      <div class="kv">
        <div><span class="k">战力</span><span class="v" style="color:${RARITY_COLOR[c.rarity]};font-weight:700">${c.power}</span></div>
        <div><span class="k">售价</span><span class="v">¥${c.price}</span></div>
        <div><span class="k">能量</span><span class="v">${n.kcal} kcal</span></div>
        <div><span class="k">蛋白质</span><span class="v">${n.protein} g</span></div>
        <div><span class="k">脂肪</span><span class="v">${n.fat} g</span></div>
        <div><span class="k">碳水</span><span class="v">${n.carb} g</span></div>
        <div><span class="k">钠</span><span class="v">${n.sodium} mg</span></div>
        <div><span class="k">钙</span><span class="v">${n.calcium} mg</span></div>
        <div><span class="k">每元战力</span><span class="v">${c.powerPerYuan}</span></div>
        <div><span class="k">类型</span><span class="v">${c.isCombo?"套餐":"单品"}</span></div>
      </div>
      ${c.components && c.components.length>1?`<div style="margin-top:14px;font-size:12px;color:#8b93a7">
        组成：${c.components.map(x=>x.name+(x.qty>1?"×"+x.qty:"")).join(" + ")}</div>`:""}
    </div>`;
  document.getElementById("mask").classList.add("on");
  if(history.replaceState) history.replaceState(null,"","#card="+c.code);
}
function closeCard(){
  document.getElementById("mask").classList.remove("on");
  if(history.replaceState) history.replaceState(null,"","#");
}
document.getElementById("mask").onclick = e=>{if(e.target.id==="mask")closeCard();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCard();});

const RATES = [["SSR",0.03],["SR",0.12],["R",0.35],["N",0.50]];
function roll(){
  let r = Math.random(), acc = 0;
  for(const [k,p] of RATES){ acc += p; if(r < acc) return k; }
  return "N";
}
function pullOnce(forceMin){
  let rar = roll();
  if(forceMin && !["SSR","SR"].includes(rar)) rar = "SR";
  const pool = cards.filter(c=>c.rarity===rar);
  return pool[Math.floor(Math.random()*pool.length)];
}
function doPull(times){
  const res = [];
  for(let i=0;i<times;i++) res.push(pullOnce(times>1 && i===times-1));
  if(times>1 && !res.some(c=>c.rarity==="SSR"||c.rarity==="SR")) res[times-1]=pullOnce(true);
  const out = document.getElementById("out");
  out.innerHTML = res.map((c,i)=>`
    <div class="mini" style="animation-delay:${i*70}ms">
      ${heroArt(c)}
      <div class="rn" style="color:${RARITY_COLOR[c.rarity]}">${c.rarity}</div>
    </div>`).join("");
}
document.getElementById("pull10").onclick = ()=>doPull(10);
document.getElementById("pull1").onclick = ()=>doPull(1);

buildFilters(); render();

/* 支持 #card=编码 直接打开某张卡，便于分享 */
if(location.hash.indexOf("#card=")===0){
  const code = location.hash.slice(6);
  const hit = cards.find(c=>String(c.code)===code);
  if(hit) openCard(hit);
}
